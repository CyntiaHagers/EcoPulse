version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: ecopulse-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ecopulse-net

  api:
    build: .
    container_name: ecopulse-api
    ports:
      - "8080:8080"
    environment:
      - MongoDbSettings__ConnectionString=${MONGO_CONN}
    depends_on:
      - mongo
    networks:
      - ecopulse-net

volumes:
  mongo_data:

networks:
  ecopulse-net: