name: EcoPulse CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore EcoPulse.Api/EcoPulse.Api.csproj

      - name: Build
        run: dotnet build EcoPulse.Api/EcoPulse.Api.csproj --configuration Release --no-restore

      - name: Testes (opcional)
        run: dotnet test EcoPulse.Api/EcoPulse.Api.csproj --no-build --verbosity normal || true

      - name: Build Docker
        run: docker build -t ecopulse-api:latest .

      - name: Rodar container (teste)
        run: docker run -d -p 8080:8080 ecopulse-api

      - name: Deploy STAGING
        if: github.ref == 'refs/heads/staging'
        run: echo "Deploy em ambiente STAGING realizado"

      - name: Deploy PRODUÇÃO
        if: github.ref == 'refs/heads/main'
        run: echo "Deploy em PRODUÇÃO realizado"